<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>AI Video Transcriber</title>
    <style>
      :root {
        --bg: #0f1115;
        --fg: #e7e9ee;
        --muted: #8b93a7;
        --accent: #6ea8fe;
        --line: #232733;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.2px; }
      .bars { display: flex; gap: 5px; align-items: flex-end; height: 26px; }
      .bars i {
        width: 5px;
        background: var(--accent);
        border-radius: 3px;
        animation: pulse 1.1s ease-in-out infinite;
      }
      .bars i:nth-child(1) { height: 10px; animation-delay: 0s; }
      .bars i:nth-child(2) { height: 20px; animation-delay: 0.12s; }
      .bars i:nth-child(3) { height: 26px; animation-delay: 0.24s; }
      .bars i:nth-child(4) { height: 16px; animation-delay: 0.36s; }
      .bars i:nth-child(5) { height: 9px; animation-delay: 0.48s; }
      @keyframes pulse {
        0%, 100% { transform: scaleY(0.45); opacity: 0.55; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      #msg { color: var(--muted); text-align: center; max-width: 340px; min-height: 42px; }
      #hint { color: var(--muted); font-size: 12px; opacity: 0.75; }
      button {
        -webkit-app-region: no-drag;
        display: none;
        padding: 7px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      @media (prefers-reduced-motion: reduce) {
        .bars i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
    <h1>AI Video Transcriber</h1>
    <p id="msg">Démarrage du moteur de transcription…</p>
    <button id="skip">Continuer sans attendre</button>
    <p id="hint"></p>

    <script>
      const msg = document.getElementById('msg');
      const hint = document.getElementById('hint');
      const skip = document.getElementById('skip');
      let serverReady = false;

      skip.addEventListener('click', () => window.splash.continue());

      window.splash.onServerReady(() => {
        serverReady = true;
        skip.style.display = 'inline-block';
      });

      function render(st) {
        if (!serverReady && st.state !== 'downloading') return;
        if (st.state === 'downloading') {
          msg.textContent =
            'Premier lancement : téléchargement du modèle de transcription (' +
            (st.model || 'base') +
            '). Environ 150 Mo, une seule fois.';
          hint.textContent = 'Vous pouvez déjà continuer : le téléchargement se poursuit en fond.';
          skip.style.display = 'inline-block';
        } else if (st.state === 'ready') {
          msg.textContent = 'Moteur prêt.';
          window.splash.continue();
        } else if (st.state === 'error') {
          msg.textContent = 'Le modèle n’a pas pu être téléchargé (connexion ?).';
          hint.textContent = 'L’application s’ouvre quand même ; réessai à la prochaine transcription.';
          skip.style.display = 'inline-block';
        }
      }

      async function poll() {
        try {
          render(await window.splash.status());
        } catch (_) {
          /* le moteur n'est pas encore là */
        }
        setTimeout(poll, 1000);
      }
      poll();
    </script>
  </body>
</html>
