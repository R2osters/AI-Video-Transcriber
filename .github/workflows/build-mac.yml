name: Build macOS

# Le paquet macOS ne peut pas être fabriqué depuis Windows : PyInstaller produit
# un binaire pour la plateforme qui l'exécute, et electron-builder a besoin des
# outils du système (hdiutil, iconutil) pour le .dmg et l'icône. Cette CI est
# donc le seul chemin de build Mac tant qu'aucun Mac physique n'est disponible.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version affichée dans le nom du paquet (informatif)"
        required: false
        default: ""
  push:
    tags: ['v*']

permissions:
  contents: write        # publication de la release

jobs:
  build:
    name: dmg + zip (arm64)
    runs-on: macos-latest        # runners macOS 14+ = Apple Silicon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dépendances Electron
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # Construit AVT-Backend (PyInstaller onedir) et le vérifie en lançant le
      # binaire avec AVT_SELFTEST=1 : sans cette étape, un import manquant ne se
      # verrait qu'au premier lancement chez l'utilisateur.
      - name: Backend (PyInstaller + selftest)
        working-directory: desktop
        run: bash scripts/build-backend.sh

      - name: ffmpeg + ffprobe
        working-directory: desktop
        run: bash scripts/download-ffmpeg.sh

      # Paquet non signé : pas de certificat Apple Developer. Gatekeeper le
      # bloquera au premier lancement, le README explique le contournement.
      - name: Paquet macOS
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac

      - name: Inventaire
        working-directory: desktop
        run: ls -lh dist-installer/


      # Publication en release, pas en artefact : le stockage des artefacts est
      # soumis a un quota de compte, celui des releases non. Un paquet de
      # 228 Mo le sature en quelques executions.
      - name: Publie le paquet
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-mac"
          printf '%s\n' \
            "Paquet arm64 (Apple Silicon), non signe : Gatekeeper le refusera au premier lancement. Clic droit sur l'application, « Ouvrir », puis confirmer." \
            "" \
            "ffmpeg et ffprobe embarques sont en x86_64 et passent par Rosetta 2. L'application elle-meme est native arm64." \
            "" \
            "Construit par la CI sur un runner macOS, jamais teste sur une machine reelle." \
            "" \
            "Ce n'est pas le point de telechargement : le paquet est recopie a la main dans R2osters/transcriber-downloads, ou Windows et macOS sont publies ensemble. Un workflow ne peut publier que dans son propre depot sans jeton personnel." \
            > notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Transcriber ${VERSION} — macOS (Apple Silicon)" \
              --notes-file notes.md \
              --prerelease
          fi
          gh release upload "$TAG" \
            "dist-installer/AI Video Transcriber-${VERSION}-arm64.dmg" \
            "dist-installer/AI Video Transcriber-${VERSION}-arm64-mac.zip" \
            --clobber
